[project]
name = "portfolio-correlation"
version = "0.1.0"
description = "Portfolio Performance Korrelationsanalyse (XML/Cache + CSV-Metadaten)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.0",
    "markdown>=3.7",
    "pyinstaller>=6.11.0",
]

[tool.uv]
package = false
